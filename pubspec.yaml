name: gamy
description: "Gamy, the talking bear reviewer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.6.0
  cloud_firestore: ^7.2.0
  crypto: ^3.0.8 # Windows sign-in (PKCE); already used inside Flutter's own packages
  file_picker: ^13.3.2
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^1.0.1
  google_sign_in: ^7.2.0
  llamadart: ^0.19.11
  path_provider: ^2.1.6
  pdfrx: ^2.12.0
  sentry_flutter: ^10.6.0
  sqlite3: ^3.9.1 # the device database (bundles SQLite itself on Android and Windows)
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Only for tests: lets them save to a temporary folder instead of your real Gamy data
  msix: ^3.18.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

# llamadart settings: bundle only llama.cpp (Gamy uses .gguf models), not Google's LiteRT engine.
# On Android only the processor (CPU) version: the A53's Mali graphics chip isn't supported anyway.
# After changing these, run `flutter clean` once.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        platforms:
          android-arm64:
            backends: [cpu]
            cpu_profile: compact

flutter:
  uses-material-design: true
  assets:
    - assets/gamy/

# Microsoft Store package (dart run msix:create). The identity must match Partner Center exactly:
# Product management -> Product identity. Raise msix_version with every Store update.
msix_config:
  display_name: "Gamy: Study Bear"
  publisher_display_name: Gamy
  identity_name: Gamy.GamyStudyBear
  publisher: CN=CEA3B406-F439-4B4B-B86C-B5D32B0E64FB
  msix_version: 1.0.0.0
  logo_path: assets/gamy/head.png
  capabilities: internetClient
  languages: en-us, fil-ph
  store: true
  # the Windows sign-in key and the crash-report key, read from the private desktop_client.json
  windows_build_args: --dart-define-from-file=desktop_client.json
